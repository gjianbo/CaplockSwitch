; ---------------------------------------------------------------------------
; CapsSwitch 示例配置文件
;
; 正式配置路径：%APPDATA%\CapsSwitch\config.ini
;   （例如 C:\Users\你的用户名\AppData\Roaming\CapsSwitch\config.ini）
;
; 本文件仅作参考，程序不会读取它。要直接使用，请：
;   1) 新建目录 %APPDATA%\CapsSwitch
;   2) 把本文件复制过去并改名为 config.ini
;
; 程序启动时只读取配置，不回写；只有在托盘菜单里切换状态、
; 或在设置窗口里改动过选项之后，才会把最新值写回 config.ini。
; 因此全新安装时该文件可能尚不存在，属正常现象。
; ---------------------------------------------------------------------------

[General]

; 是否启用 Caps Lock 替换
;   1 = 启用：单独按 Caps 发送输入法切换快捷键；
;             Shift + Caps 放行，执行原生大写锁定
;   0 = 暂停：完全不拦截，Caps Lock 使用系统原生行为
Enabled=1

; 是否开机自动启动
; 注意：实际是否自启以注册表为准，见
;   HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run
;   值名 CapsSwitch
; 这里的值只是程序写入配置时留下的一份记录。
AutoStart=0

; 按 Caps Lock 时发送的输入法切换快捷键
;   0 = Ctrl + Space          Windows 默认输入法切换（默认值）
;   1 = Win + Space           Win10/11 输入法循环
;   2 = Shift + Space         部分第三方输入法
;   3 = Ctrl + Shift + Space  传统中文输入法
HotkeyMode=0
